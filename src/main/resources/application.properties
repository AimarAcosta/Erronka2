# 1. CONEXION A BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/eduelorrieta?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.devtools.restart.enabled\==false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. CONFIGURACION HIBERNATE & XML
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.mapping-resources=modelo/Users.hbm.xml, modelo/Ciclos.hbm.xml, modelo/Modulos.hbm.xml, modelo/Horarios.hbm.xml, modelo/Matriculaciones.hbm.xml, modelo/Reuniones.hbm.xml, modelo/Tipos.hbm.xml