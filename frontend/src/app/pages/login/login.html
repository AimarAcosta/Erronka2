<div class="pagina-login">
  <div class="tarjeta-login">
    <!-- Cabecera con logo -->
    <div class="cabecera-login">
      <div class="logo-contenedor">
        <img src="assets/logo.jpg" alt="Elorrieta Logo" class="logo-login" />
      </div>
      <h2 class="titulo-app">ElorAdmin</h2>
      <p class="subtitulo">{{ 'LOGIN.TITLE' | translate }}</p>
    </div>

    <!-- Separador -->
    <div class="separador">
      <span class="linea"></span>
      <i class="bi bi-shield-lock-fill icono-separador"></i>
      <span class="linea"></span>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onLogin()" class="formulario-login">
      <div class="campo">
        <label for="username">
          <i class="bi bi-person-fill"></i> {{ 'LOGIN.USERNAME' | translate }}
        </label>
        <div class="campo-input">
          <input 
            type="text" 
            id="username" 
            [(ngModel)]="username" 
            name="username" 
            placeholder="Sartu zure erabiltzailea..."
            required 
          />
        </div>
      </div>

      <div class="campo">
        <label for="password">
          <i class="bi bi-lock-fill"></i> {{ 'LOGIN.PASSWORD' | translate }}
        </label>
        <div class="campo-input">
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••"
            required 
          />
        </div>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="mensaje-error">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Botón de entrar -->
      <button type="submit" class="btn-entrar">
        <i class="bi bi-box-arrow-in-right"></i>
        {{ 'LOGIN.SUBMIT' | translate }}
      </button>
    </form>

    <!-- Footer de la tarjeta -->
    <div class="footer-tarjeta">
      <i class="bi bi-building"></i>
      <span>CIFP Elorrieta-Erreka Mari</span>
    </div>
  </div>
</div>
