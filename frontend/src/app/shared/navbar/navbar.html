<nav class="barra-navegacion">
  <div class="contenedor-nav">
    <a class="logo-marca" routerLink="/">
      <img src="assets/logo.jpg" alt="Logo" width="30" height="30" />
      <span>Elorrieta</span>
    </a>

    <div class="acciones-nav">
      <div class="botones-idioma">
        <button 
          *ngFor="let idioma of idiomas"
          class="btn-idioma"
          [class.activo]="idiomaActual === idioma.codigo"
          (click)="cambiarIdioma(idioma.codigo)">
          {{ idioma.codigo | uppercase }}
        </button>
      </div>

      <div *ngIf="usuarioActual" class="info-usuario">
        <div class="nombre-usuario">{{ usuarioActual.nombre }} {{ usuarioActual.apellidos }}</div>
        <div class="etiqueta-rol">{{ usuarioActual.role | uppercase }}</div>
      </div>

      <button *ngIf="usuarioActual" class="btn-salir" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i> {{ 'NAV.LOGOUT' | translate }}
      </button>
    </div>
  </div>
</nav>
