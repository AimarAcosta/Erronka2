<nav class="barra-navegacion">
  <div class="contenedor-nav">
    <a class="logo-marca" routerLink="/">
      <img src="assets/logo.jpg" alt="Logo" width="30" height="30" />
      <span>Elorrieta</span>
    </a>

    <div class="acciones-nav">
      <div class="botones-idioma">
        <button 
          *ngFor="let lang of languages"
          class="btn-idioma"
          [class.activo]="currentLang === lang.code"
          (click)="cambiarIdioma(lang.code)">
          {{ lang.code | uppercase }}
        </button>
      </div>

      <div *ngIf="currentUser" class="info-usuario">
        <div class="nombre-usuario">{{ currentUser.nombre }} {{ currentUser.apellidos }}</div>
        <div class="etiqueta-rol">{{ currentUser.role | uppercase }}</div>
      </div>

      <button *ngIf="currentUser" class="btn-salir" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i> {{ 'NAV.LOGOUT' | translate }}
      </button>
    </div>
  </div>
</nav>
